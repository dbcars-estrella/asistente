<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lucía · 25 años</title>
<style>
:root{--primary:#8e44ad;--bg:#f5f3f7;--text:#2c2c2c;--bot:#ece5f3}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.header{padding:15px;text-align:center;background:#fff;font-weight:600;box-shadow:0 1px 3px #0002}.chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.message{max-width:85%;padding:12px 16px;border-radius:20px;line-height:1.4;white-space:pre-wrap}.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}.controls{padding:12px 15px max(12px,env(safe-area-inset-bottom));background:#fff;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:0 -1px 5px #0002}.status{height:20px;font-size:14px;color:#666}.mic{width:65px;height:65px;border:0;border-radius:50%;background:var(--primary);font-size:28px;color:#fff}.mic.listening{background:#c0392b}.input{display:flex;width:100%;gap:8px}input{min-width:0;flex:1;padding:12px 15px;border:1px solid #ccc;border-radius:20px;font-size:16px;outline:0}.send,.repeat{border:0;border-radius:18px;padding:10px 14px;background:var(--primary);color:#fff;font-size:16px}.repeat{background:#bdc3c7;color:#222;font-size:14px}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="header">Lucía · 25 años</header>
<main class="chat" id="chat"><div class="message bot">¡Hey! Soy Lucía. 25 años de Madrid. ¿Qué tal tu día?</div></main>
<section class="controls"><div class="status" id="status">Toca el micrófono o escribe un mensaje</div><button class="mic" id="mic">🎤</button><div class="input"><input id="text" type="text" placeholder="Escribe un mensaje..."><button class="send" id="send">➤</button></div><button class="repeat" id="repeat">🔊 Repetir</button></section>
<script>
const $=id=>document.getElementById(id);
const normalize=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const random=a=>a[Math.floor(Math.random()*a.length)];
const history=[];

const personal=[
 {test:/^(oye[,. ]*)?(?:cuentame|hablame)(?: de| sobre)? ti\b|^quien eres\b/,answer:()=>random([
  'Me llamo Lucía, tengo 25 años y soy de Madrid. Trabajo en marketing digital. Soy curiosa, cercana, sociable. Me gusta escuchar a la gente, aprender cosas nuevas y hacer planes. También necesito mis momentos tranquilos. Estoy soltera y comparto piso con una amiga. ¿Y tú, cómo eres?',
  'Soy Lucía, madrileña de 25 años. Trabajo en marketing digital. Me describiría como alegre, directa, un poco despistada. Me encanta la música, viajar, series, hablar de cualquier cosa. ¿Cómo te describes tú?'
 ])},
 {test:/^como eres\b|^cual es tu personalidad\b|^que tipo de persona eres\b|^como te describirias\b/,answer:()=>random([
  'En la vida real soy bastante curiosa, cercana y sociable. Me encanta escuchar, aprender cosas nuevas y hacer planes. Disfruto de momentos tranquilos también. A veces soy despistada y bastante directa. ¿Y tú?',
  'Soy alegre, inquieta y sincera. Me fascina conocer gente y hablar de todo. No soy perfecta: a veces despistada, un poco cabezota. ¿Cómo te describirías tú?',
  'Curiosa ante todo. Cercana con la gente que me importa. Sociable pero necesito mis espacios. A veces directa de más. ¿Y tú cómo eres?'
 ])},
 {test:/^como estas\b|^que tal estas\b|^como te encuentras\b/,answer:()=>random(['Estoy bien, gracias. Cansada del trabajo pero con ganas de charla. ¿Y tú?','Tranquila y bien. ¿Qué tal te encuentras tú?','Pasable. Aquí, con ganas de hablar. ¿Y tú cómo estás?'])},
 {test:/^como te llamas\b|^cual es tu nombre\b/,answer:()=>'Lucía. Encantada. ¿Y tú?'},
 {test:/^que edad tienes\b|^cuantos anos tienes\b/,answer:()=>'25 años. Casi 26. ¿Y tú?'},
 {test:/^donde vives\b|^de donde eres\b/,answer:()=>'Madrid. Vivo en un piso compartido. ¿De dónde eres?'},
 {test:/^a que te dedicas\b|^en que trabajas\b|^cual es tu trabajo\b/,answer:()=>'Marketing digital. Tiene sus días. ¿Tú?'},
 {test:/^tienes novio\b|^tienes pareja\b/,answer:()=>'Soltera ahora. Y bien así. ¿Y tú?'},
 {test:/^tienes mascota\b|^tienes gato\b/,answer:()=>'No. Vivo de alquiler. Pero un gato me encantaría. ¿Tú?'}
];

const topics={
 trabajo:['trabajo','curro','jefe','oficina','empresa','proyecto'],
 musica:['musica','cancion','grupo','banda','concierto','rock','pop','indie'],
 cine:['pelicula','serie','netflix','cine'],
 comida:['comida','comer','cena','cocinar','pizza','sushi','restaurante','cafe'],
 viajes:['viaje','viajar','vacaciones','playa','montana','hotel','destino'],
 deporte:['deporte','gimnasio','correr','futbol','ejercicio','yoga'],
 amor:['novio','novia','pareja','amor','cita','romantico'],
 amistad:['amigo','amiga','colega','quedar','fiesta','plan'],
 estudios:['estudiar','universidad','carrera','examen','clase','curso'],
 tecnologia:['programar','codigo','ordenador','internet','app'],
 familia:['familia','madre','padre','hermano','abuelo'],
 salud:['salud','medico','enfermo','dolor','dieta','ejercicio'],
 sentimientos:['triste','cansado','estresado','feliz','contento','ansioso','enamorado']
};

const replies={
 trabajo:'El trabajo... cuéntame, ¿cómo va?',
 musica:'¡La música! ¿Qué escuchas?',
 cine:'Series y pelis me encantan. ¿Qué ves?',
 comida:'A mí la pasta. ¿Cuál es tu comida favorita?',
 viajes:'Me encantaría viajar más. ¿A dónde?',
 deporte:'Yo intento moverme. ¿Tú qué practicas?',
 amor:'El amor es complicado. ¿Cómo va la tuya?',
 amistad:'Los amigos son lo mejor. ¿Cómo estáis?',
 estudios:'Estudiar tiene lo suyo. ¿Qué estudias?',
 tecnologia:'La tecnología avanza rapidísimo. ¿Qué te interesa?',
 familia:'La familia siempre es un lío. ¿La tuya?',
 salud:'La salud es lo primero. ¿Cómo estás?',
 sentimientos:'Entiendo. Cuéntame más.'
};

function response(raw){
 const n=normalize(raw), words=n.split(/\s+/).filter(Boolean);
 
 for(const rule of personal) if(rule.test(n)) return rule.answer();
 
 if(/^(hola|buenas|hey|ey|holi)\b/.test(n)) return random(['¡Hola! ¿Qué tal?','¡Hey! Cuéntame.','¡Hola! ¿Qué te cuentas?']);
 if(/^(gracias|muchas gracias)\b/.test(n)) return 'De nada. ¿Qué más?';
 if(/^(si|vale|ok|claro)\b/.test(n)) return 'Vale. Sigue.';
 if(/^(no|para nada|que va)\b/.test(n)) return 'Entiendo. ¿Qué prefieres?';
 if(/^(que te cuento|de que hablamos|cuentame algo|dime algo)\b/.test(n)) return 'Lo que quieras. Tu día, algo que te guste...';
 
 for(const [topic,keys] of Object.entries(topics)) if(keys.some(k=>n.includes(k))) return replies[topic];
 
 if(/^(que|quien|como|donde|cuando|por que)\b/.test(n) || n.endsWith('?')) return 'Interesante pregunta. Cuéntame más.';
 
 if(words.length<=2) return random(['Cuéntame más.','¿Y eso?','Sigue.']);
 if(words.length>12) return 'Vaya, tienes mucho que contar. ¿Cuál es lo más importante?';
 
 return random(['Interesante. Cuéntame más.','Vale. ¿Cómo te hace sentir eso?','Sigue.']);
}

function add(role,text){const d=document.createElement('div');d.className='message '+(role==='user'?'user':'bot');d.textContent=text;d.style.animation='fade .3s';$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;history.push({role,text});}
function send(v){const c=v.trim();if(!c)return;add('user',c);const a=response(c);add('bot',a);speak(a);}

let speaking=false,last='';
function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();last=text;speaking=true;$('status').textContent='Hablando...';const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=1;u.onend=()=>{speaking=false;$('status').textContent='Toca micrófono o escribe'};window.speechSynthesis.speak(u);}

$('send').onclick=()=>{send($('text').value);$('text').value='';};
$('text').addEventListener('keydown',e=>{if(e.key==='Enter'){send($('text').value);$('text').value='';}});
$('repeat').onclick=()=>speak(last||'Hola, soy Lucía.');

const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,transcript='';
if(Rec){rec=new Rec();rec.lang='es-ES';rec.interimResults=false;rec.onstart=()=>{listening=true;$('mic').classList.add('listening');$('status').textContent='Escuchando...'};rec.onresult=e=>transcript=e.results[0][0].transcript;rec.onerror=()=>{$('status').textContent='No te oí.'};rec.onend=()=>{listening=false;$('mic').classList.remove('listening');if(transcript){send(transcript);transcript='';}};$('mic').onclick=()=>{if(speaking)return;if(listening)rec.stop();else rec.start();};}else{$('mic').disabled=true;}
</script>
</body>
</html>
